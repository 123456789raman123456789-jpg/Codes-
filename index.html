<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #ff1a1a;
  color: white;
  text-align: center;
}

/* ===== COMMON ===== */
.page {
  display: none;
  height: 100vh;
  padding: 30px 15px;
}

.active {
  display: block;
}

h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

h2 {
  font-size: 20px;
  font-weight: 400;
}

button {
  margin: 10px;
  padding: 12px 25px;
  border: none;
  border-radius: 25px;
  font-size: 16px;
}

/* ===== PASSCODE ===== */
input {
  padding: 15px;
  border-radius: 10px;
  border: none;
  width: 200px;
  font-size: 18px;
  text-align: center;
}

/* ===== IMAGE STYLES ===== */
.img1 {
  width: 120px;
  border-radius: 15px;
}

.img2 {
  width: 45%;
  border-radius: 15px;
}

/* layout */
.row {
  display: flex;
  justify-content: center;
  gap: 10px;
}

.right {
  display: flex;
  justify-content: center;
}

</style>
</head>

<body>

<!-- 🎵 SONG -->
<audio id="song" src="music.mp3"></audio>

<!-- 🔐 PASSCODE -->
<div class="page active" id="lock">
  <h1>Enter Passcode 🔐</h1>
  <input id="code" placeholder="Enter code"><br><br>
  <button onclick="unlock()">Next</button>
</div>

<!-- ❤️ PAGE 1 (1 PHOTO RIGHT SIDE) -->
<div class="page" id="p1">
  <h1>HAPPY BIRTHDAY, MY LOVE ❤️</h1>
  <h2>May our love continue to blossom and flourish forever.</h2>

  <div class="right">
    <img src="photo1.jpg" class="img1">
  </div>

  <button onclick="prev()">← Back</button>
  <button onclick="next()">Next →</button>
</div>

<!-- 💙 PAGE 2 (2 PHOTOS) -->
<div class="page" id="p2">
  <h1>Best Moments 💙</h1>

  <div class="row">
    <img src="photo2.jpg" class="img2">
    <img src="photo3.jpg" class="img2">
  </div>

  <button onclick="prev()">← Back</button>
  <button onclick="next()">Next →</button>
</div>

<!-- 💌 PAGE 3 (1 PHOTO) -->
<div class="page" id="p3">
  <h1>My Love 💖</h1>

  <img src="photo4.jpg" class="img1"><br><br>

  <h2>
    Aap meri life ka sabse beautiful part ho…  
    aur main bas itna chahta hoon ki aap hamesha khush raho 💕
  </h2>

  <button onclick="prev()">← Back</button>
</div>

<script>
let pages = ["lock","p1","p2","p3"];
let current = 0;

function show(i){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(pages[i]).classList.add("active");
}

function next(){
  if(current < pages.length-1){
    current++;
    show(current);
  }
}

function prev(){
  if(current > 1){
    current--;
    show(current);
  }
}

function unlock(){
  let val = document.getElementById("code").value;
  if(val === "0208"){   // change if needed
    current = 1;
    show(current);
    document.getElementById("song").play();
  } else {
    alert("Wrong passcode 😏");
  }
}
</script>

</body>
</html>
