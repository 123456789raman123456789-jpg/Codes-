<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Her ❤️</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #ff2e2e;
  color: white;
  overflow: hidden;
}

.page {
  display: none;
  height: 100vh;
  width: 100%;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  transition: 0.5s;
}

.active {
  display: flex;
  animation: fade 0.6s ease;
}

@keyframes fade {
  from {opacity:0; transform:scale(0.95);}
  to {opacity:1; transform:scale(1);}
}

button {
  padding: 12px 25px;
  border: none;
  border-radius: 20px;
  background: white;
  color: black;
  font-weight: bold;
  margin-top: 20px;
}

input {
  padding: 10px;
  font-size: 18px;
  text-align: center;
  border-radius: 10px;
  border: none;
}

/* images */
.img {
  width: 220px;
  border-radius: 15px;
  margin: 15px 0;
}

/* gift icons */
.gifts {
  display: flex;
  gap: 20px;
}

.gift {
  font-size: 40px;
  cursor: pointer;
}

/* love letter */
.letter {
  background: white;
  color: black;
  padding: 20px;
  border-radius: 15px;
  width: 80%;
  max-width: 300px;
}

</style>
</head>

<body>

<!-- PAGE 1 PASSCODE -->
<div class="page active" id="p1">
  <h2>Enter Passcode 🔐</h2>
  <input id="code" maxlength="4" placeholder="****">
  <button onclick="checkCode()">NEXT</button>
</div>

<div class="page" id="p2">
  <h2>Ready for a surprise? 📸</h2>
  <img src="photo1.jpg" class="img">
  <button onclick="next(3)">Take Photo</button>
</div>
