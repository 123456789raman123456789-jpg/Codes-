<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #ff2e2e;
  color: white;
  text-align: center;
}

/* pages */
.page {
  display: none;
  height: 100vh;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.active {
  display: flex;
}

/* inputs & buttons */
input {
  padding: 12px;
  border-radius: 10px;
  border: none;
  font-size: 18px;
  text-align: center;
}

button {
  padding: 12px 25px;
  border-radius: 20px;
  border: none;
  margin-top: 20px;
  font-weight: bold;
  cursor: pointer;
}

/* images */
.img {
  width: 220px;
  border-radius: 15px;
  margin-top: 20px;
}

/* gifts */
.gifts {
  display: flex;
  gap: 25px;
  font-size: 40px;
}

/* letter box */
.letter {
  background: white;
  color: black;
  padding: 20px;
  border-radius: 15px;
  width: 80%;
  max-width: 320px;
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div id="p1" class="page active">
  <h2>Enter Passcode 🔐</h2>
  <input id="code" placeholder="****">
  <button onclick="checkCode()">NEXT</button>
</div>

<!-- PAGE 2 -->
<div id="p2" class="page">
  <h2>Ready for a surprise? 📸</h2>
  <img src="photo1.jpg" class="img">
  <button onclick="nextPage(3)">NEXT</button>
</div>

<!-- PAGE 3 -->
<div id="p3" class="page">
  <h2>Who is this beautiful 😏</h2>
  <img src="photo2.jpg" class="img">
  <button onclick="nextPage(4)">NEXT</button>
</div>

<!-- PAGE 4 -->
<div id="p4" class="page">
  <h2>Gifts for you 🎁</h2>
  <div class="gifts">
    <div onclick="nextPage(5)">💌</div>
    <div onclick="nextPage(6)">📷</div>
    <div onclick="nextPage(7)">🎵</div>
  </div>
</div>

<!-- PAGE 5 -->
<div id="p5" class="page">
  <div class="letter">
    <h3>My Love ❤️</h3>
    <p>
      You make my world brighter.  
      Every moment with you feels special.  
      I'm really lucky to have you ❤️
    </p>
  </div>
  <button onclick="nextPage(8)">NEXT</button>
</div>

<!-- PAGE 6 -->
<div id="p6" class="page">
  <h2>Our Memories 📸</h2>
  <img src="photo3.jpg" class="img">
  <button onclick="nextPage(8)">NEXT</button>
</div>

<!-- PAGE 7 -->
<div id="p7" class="page">
  <h2>Our Song 🎶</h2>
  <audio controls>
    <source src="music.mp3">
  </audio>
  <button onclick="nextPage(8)">NEXT</button>
</div>

<!-- PAGE 8 -->
<div id="p8" class="page">
  <h1>Happy Birthday ❤️🎂</h1>
  <img src="photo4.jpg" class="img">
  <p>I love you more than words can express 💖</p>
</div>

<script>
function nextPage(n) {
  let current = document.querySelector(".active");
  if (current) current.classList.remove("active");

  let next = document.getElementById("p" + n);
  if (next) next.classList.add("active");
}

function checkCode() {
  let code = document.getElementById("code").value.trim();

  if (code === "0208") {
    nextPage(2);
  } else {
    alert("Wrong passcode 😅");
  }
}
</script>

</body>
</html>
